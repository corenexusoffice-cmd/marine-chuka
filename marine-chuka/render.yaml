# Render Blueprint: New > Blueprint > pick this repo.
# Render reads this file and sets everything up.
services:
  - type: web
    name: afropiano
    runtime: node
    region: frankfurt
    plan: free            # change to "starter" ($7/mo) before the event so the site never sleeps
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false       # paste: postgresql://postgres.bynepncmliaggkbykvvp:pt1x9l7gg5RaI5ea@aws-0-eu-west-1.pooler.supabase.com:6543/postgres
      - key: TICKET_SECRET
        sync: false       # paste: 878b090a-002b-4aa6-b741-2fec2a0a0ae3
      - key: ADMIN_KEY
        sync: false       # paste: cb41b190-0769-45be-9d91-07c312fdc1be
      - key: IPN_SECRET
        sync: false       # paste: 18a5f9cc-449a-4b21-bb77-389f115c3576
